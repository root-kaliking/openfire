name: Build & Release

# 手动触发：bump 版本 + 冒烟测试 + 导出全部产物（客户端 + 专用服务器 + 中央服务器）+ 发布 GitHub Release
# push/PR 触发：冒烟测试 + 导出全部产物 + 上传为 workflow artifact（方便下载测试，不发 Release）
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump level
        type: choice
        default: patch
        options: [patch, minor, major]
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write          # release job 需要 push bump commit + tag + create release

env:
  GODOT_VERSION: 4.7.1
  GODOT_RELEASE: stable

jobs:
  # ===========================================================================
  # release：手动触发，完整发布流程（bump + 构建 + GitHub Release）
  # ===========================================================================
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Godot ${{ env.GODOT_VERSION }} + export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          curl -fL -o godot.zip "$base/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          curl -fL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          unzip -q templates.tpz
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$dest"
          mv templates/* "$dest/"
          godot --version

      - name: Setup Go (for central server build)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup JDK 17 + Android SDK (for APK build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android commandline tools + SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -fL -o cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          yes 2>/dev/null | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest"

      - name: Generate Android debug keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh "$HOME/.android/debug.keystore"

      - name: Restore NobodyWho addon (optional)
        continue-on-error: true
        env:
          NOBODYWHO_URL: ${{ vars.NOBODYWHO_URL }}
        run: |
          set -uo pipefail
          if [ -n "${NOBODYWHO_URL:-}" ]; then
            curl -fL -o nw.zip "$NOBODYWHO_URL" && mkdir -p nw_extract && unzip -o -q nw.zip -d nw_extract
            for lib in \
              libnobodywho-godot-x86_64-unknown-linux-gnu-release.so \
              libnobodywho-godot-x86_64-pc-windows-msvc-release.dll \
              libnobodywho-godot-x86_64-apple-darwin-release.dylib \
              libnobodywho-godot-aarch64-apple-darwin-release.dylib; do
              found=$(find nw_extract -name "$lib" | head -1)
              [ -n "$found" ] && cp "$found" addons/nobodywho/
            done
          fi
          if ! ls addons/nobodywho/*.so addons/nobodywho/*.dll addons/nobodywho/*.dylib >/dev/null 2>&1; then
            echo "::warning::No NobodyWho libs — building without the embedded LLM (set NOBODYWHO_URL to include it)."
            rm -f addons/nobodywho/nobodywho.gdextension addons/nobodywho/nobodywho.gdextension.uid
          else
            echo "Embedded LLM libs present:"; ls -1 addons/nobodywho/ | grep -E '\.(so|dll|dylib)$'
          fi

      - name: Bump version (${{ inputs.bump }})
        id: bump
        run: |
          NEW=$(python3 tools/bump_version.py "${{ inputs.bump }}")
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "Releasing OpenFire v$NEW"

      - name: Import project
        run: godot --headless --path . --import

      - name: Smoke test (release gate)
        run: |
          set -uo pipefail
          godot --headless --path . tests/smoke.tscn 2>&1 | tee smoke.log
          grep -q "SMOKE: DONE ok=true" smoke.log

      - name: Export all builds (clients + dedicated server + central server)
        run: |
          set -euo pipefail
          mkdir -p build dist
          V="${{ steps.bump.outputs.version }}"

          # --- 客户端构建 ---
          godot --headless --path . --export-release "Linux"   build/openfire.x86_64
          godot --headless --path . --export-release "Windows" build/openfire.exe
          godot --headless --path . --export-release "macOS"   build/openfire-macos.zip
          godot --headless --path . --export-release "Android" build/openfire.apk

          # --- 专用游戏服务器（Dedicated Server，Linux x86_64）---
          godot --headless --path . --export-release "Dedicated Server" build/openfire-server
          chmod +x build/openfire-server

          # --- Go 中央服务器（Linux x86_64）---
          cd server && go mod tidy && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../build/openfire-central ./cmd/server && cd ..

          # --- 打包到 dist/ ---
          cp -f addons/nobodywho/*.so build/ 2>/dev/null || true

          # Linux 客户端（含 LLM 库若有）
          ( cd build && zip -j "../dist/openfire-${V}-linux-x86_64.zip" openfire.x86_64 libnobodywho-*.so 2>/dev/null \
              || zip -j "../dist/openfire-${V}-linux-x86_64.zip" openfire.x86_64 )
          # Windows 客户端
          ( cd build && zip -j "../dist/openfire-${V}-windows-x64.zip"  openfire.exe libnobodywho-*.dll 2>/dev/null \
              || zip -j "../dist/openfire-${V}-windows-x64.zip"  openfire.exe )
          # macOS 客户端
          cp build/openfire-macos.zip "dist/openfire-${V}-macos.zip"
          # Android APK
          cp build/openfire.apk "dist/openfire-${V}-android-arm64-v8a.apk"

          # 专用游戏服务器（Linux）
          ( cd build && zip -j "../dist/openfire-${V}-dedicated-server-linux-x86_64.zip" openfire-server )

          # Go 中央服务器（Linux，含迁移脚本）
          mkdir -p central-pkg/server/migrations
          cp build/openfire-central central-pkg/
          cp server/.env.example central-pkg/server/
          cp server/migrations/001_init.sql central-pkg/server/migrations/
          cp server/README.md central-pkg/server/
          ( cd central-pkg && zip -r "../dist/openfire-${V}-central-server-linux-x86_64.zip" . )

          echo "=== All artifacts ==="; ls -lh dist

      - name: Build ComfyUI bundle (auto-install asset)
        run: |
          set -euo pipefail
          bash tools/make_comfyui_bundle.sh
          cp build/comfyui-bundle.zip dist/comfyui-bundle.zip
          ls -lh dist/comfyui-bundle.zip

      - name: Commit version bump & tag
        run: |
          set -euo pipefail
          V="${{ steps.bump.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add project.godot
          git commit -m "Release v$V"
          git tag "v$V"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "v$V"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: OpenFire v${{ steps.bump.outputs.version }}
          generate_release_notes: true
          files: dist/*

  # ===========================================================================
  # check：push/PR 触发，构建全部产物并上传为 artifact 供下载测试（不发 Release）
  # ===========================================================================
  check:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }} + export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          curl -fL -o godot.zip "$base/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          curl -fL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          unzip -q templates.tpz
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$dest"
          mv templates/* "$dest/"
          godot --version

      - name: Setup Go (for central server build)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup JDK 17 + Android SDK (for APK build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android commandline tools + SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -fL -o cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          yes 2>/dev/null | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest"

      - name: Generate Android debug keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore NobodyWho addon (optional)
        continue-on-error: true
        env:
          NOBODYWHO_URL: ${{ vars.NOBODYWHO_URL }}
        run: |
          set -uo pipefail
          if [ -n "${NOBODYWHO_URL:-}" ]; then
            curl -fL -o nw.zip "$NOBODYWHO_URL" && mkdir -p nw_extract && unzip -o -q nw.zip -d nw_extract
            for lib in \
              libnobodywho-godot-x86_64-unknown-linux-gnu-release.so \
              libnobodywho-godot-x86_64-pc-windows-msvc-release.dll \
              libnobodywho-godot-x86_64-apple-darwin-release.dylib \
              libnobodywho-godot-aarch64-apple-darwin-release.dylib; do
              found=$(find nw_extract -name "$lib" | head -1)
              [ -n "$found" ] && cp "$found" addons/nobodywho/
            done
          fi
          if ! ls addons/nobodywho/*.so addons/nobodywho/*.dll addons/nobodywho/*.dylib >/dev/null 2>&1; then
            echo "::warning::No NobodyWho libs — removing .gdextension manifest for CI check."
            rm -f addons/nobodywho/nobodywho.gdextension addons/nobodywho/nobodywho.gdextension.uid
          else
            echo "Embedded LLM libs present:"; ls -1 addons/nobodywho/ | grep -E '\.(so|dll|dylib)$'
          fi

      - name: Import all game assets
        run: godot --headless --path . --import

      - name: Smoke test validation
        run: |
          set -uo pipefail
          godot --headless --path . tests/smoke.tscn 2>&1 | tee smoke.log
          grep -q "SMOKE: DONE ok=true" smoke.log

      - name: Export all builds (clients + dedicated server + central server)
        run: |
          set -euo pipefail
          mkdir -p build dist

          # --- 客户端构建 ---
          godot --headless --path . --export-release "Linux"   build/openfire.x86_64
          godot --headless --path . --export-release "Windows" build/openfire.exe
          godot --headless --path . --export-release "macOS"   build/openfire-macos.zip
          godot --headless --path . --export-release "Android" build/openfire.apk

          # --- 专用游戏服务器（Dedicated Server，Linux x86_64）---
          godot --headless --path . --export-release "Dedicated Server" build/openfire-server
