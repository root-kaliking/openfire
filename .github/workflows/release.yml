              || zip -j "../dist/openfire-windows-x64.zip"  openfire.exe )
          cp build/openfire-macos.zip "dist/openfire-macos.zip"
          cp build/openfire.apk "dist/openfire-android-arm64-v8a.apk"

          # 专用游戏服务器（Linux）
          ( cd build && zip -j "../dist/openfire-dedicated-server-linux-x86_64.zip" openfire-server )

