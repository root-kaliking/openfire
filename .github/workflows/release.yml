          ( cd central-pkg && zip -r "../dist/openfire-central-server-linux-x86_64.zip" . )

          echo "=== All artifacts ==="; ls -lh dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openfire-builds-${{ github.sha }}
          path: dist/*
          retention-days: 14
